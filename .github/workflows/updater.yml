name: ZAALS Streetwear Price & Status Updater

on:
  schedule:
    # India Morning 9:00 AM IST (03:30 UTC)
    - cron: '30 3 * * *'
    # USA Morning 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Enables a premium manual "Run Workflow" button on GitHub UI!

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price & Stock Updater
        env:
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python price_updater.py
